---
name: Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full git history for git-revision-date plugin

      - uses: cachix/install-nix-action@v31

      - run: nix profile add "github:NixOS/nixpkgs/35e212742ceab4ae1dcfbfd9039a39215c816e8e#devenv"

      - shell: devenv shell -O git-hooks.enable:bool false -- bash -e {0}
        run: zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment
